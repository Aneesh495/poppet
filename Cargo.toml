[package]
name = "poppet"
version = "0.1.0"
edition = "2021"
authors = ["Aneesh Krishna Parthasarathy <aneeshkrishnaparthasarathy@gmail.com>"]
description = "Safety-Critical High-Integrity Pressure Protection System (HIPPS) and Electro-Hydraulic Multiplex (MUX) Poppet Valve Control Engine in Befunge and Rust"
license = "ISC"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
rhai = { version = "1.19", features = ["sync", "decimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
crc32fast = "1.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "poppet"
path = "src/main.rs"

[lib]
name = "poppet"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"
